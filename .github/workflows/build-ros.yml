name: Build and Push ROS Container

on:
  push:
    branches: [main]
    paths:
      - 'ubuntu-ros.ini'
      - '.container_setup.sh'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install distrobox
        run: curl -s https://raw.githubusercontent.com/89luca89/distrobox/main/install | sudo sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build INI with base image (override Docker Hub image for fresh build)
        run: |
          sed 's|image=docker.io/${{ vars.DOCKERHUB_USERNAME }}/cyclone-ros:latest|image=ubuntu:24.04|' \
            ubuntu-ros.ini > /tmp/ubuntu-ros-build.ini

      - name: Assemble container
        run: DBX_NON_INTERACTIVE=1 distrobox-assemble create --file /tmp/ubuntu-ros-build.ini

      - name: Trigger first-enter initialization (runs init_hooks)
        run: distrobox-enter ubuntu-ros -- true

      - name: Stop container
        run: distrobox-stop ubuntu-ros

      - name: Commit and push image
        run: |
          docker commit ubuntu-ros ${{ vars.DOCKERHUB_USERNAME }}/cyclone-ros:latest
          docker tag ${{ vars.DOCKERHUB_USERNAME }}/cyclone-ros:latest \
                     ${{ vars.DOCKERHUB_USERNAME }}/cyclone-ros:${{ github.sha }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/cyclone-ros:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/cyclone-ros:${{ github.sha }}

      - name: Clean up container
        if: always()
        run: distrobox-rm --force ubuntu-ros