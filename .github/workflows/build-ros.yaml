name: Build and Push ROS Container

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.ros'
      - '.container_setup.sh'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ros
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/cyclone-ros:latest
            ${{ vars.DOCKERHUB_USERNAME }}/cyclone-ros:${{ github.sha }}
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/cyclone-ros:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/cyclone-ros:buildcache,mode=max