name: Build and Push MATLAB Container

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.matlab'
      - 'mpm_input_r2025b.txt'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.matlab
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/cyclone-matlab:latest
            ${{ vars.DOCKERHUB_USERNAME }}/cyclone-matlab:${{ github.sha }}
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/cyclone-matlab:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/cyclone-matlab:buildcache,mode=max